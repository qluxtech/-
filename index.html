<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>M&A-SWARM OMNIBUS v12.0 | Global Omnibus Terminal</title>
  <style>
    :root {
      --bg-core: #010206;
      --panel-bg: rgba(6, 10, 20, 0.94);
      --panel-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-gold: #fbbf24;
      --accent-orange: #f97316;
      --accent-purple: #c084fc;
      --font-mono: "JetBrains Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }

    html, body {
      background-color: var(--bg-core); color: var(--text-main);
      height: 100vh; width: 100vw; overflow: hidden;
    }

    body { display: flex; flex-direction: column; padding: 6px; gap: 6px; }

    #globalCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

    .app-viewport {
      position: relative; z-index: 1; width: 100%; height: 100%;
      display: flex; flex-direction: column; gap: 6px; max-width: 1920px; margin: 0 auto;
    }

    header {
      background: var(--panel-bg); backdrop-filter: blur(24px);
      border: 1px solid var(--panel-border); border-radius: 8px;
      padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }

    .brand-title { font-weight: 900; font-size: 0.9rem; background: linear-gradient(135deg, #fff, var(--accent-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .global-controls { display: flex; gap: 6px; align-items: center; }
    .select-lang, .select-curr {
      background: #020408; border: 1px solid var(--panel-border); color: var(--accent-cyan);
      font-size: 0.6rem; padding: 3px 6px; border-radius: 4px; outline: none; font-weight: 700; cursor: pointer;
    }

    /* オーナー自動収益トップティッカー（グローバル対応） */
    .owner-ticker {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(56, 189, 248, 0.08));
      border: 1px solid rgba(16, 185, 129, 0.4); border-radius: 8px;
      padding: 8px 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex-shrink: 0;
    }
    .ot-item { display: flex; flex-direction: column; gap: 1px; }
    .ot-lbl { font-size: 0.55rem; color: var(--text-sub); text-transform: uppercase; }
    .ot-val { font-size: 1.05rem; font-weight: 900; font-family: var(--font-mono); }

    /* メイングリッド */
    .global-grid {
      display: grid; grid-template-columns: 1.4fr 1fr; gap: 6px; flex-grow: 1; min-height: 0;
    }
    @media (max-width: 960px) { .global-grid { grid-template-columns: 1fr; } }

    .panel {
      background: var(--panel-bg); backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border); border-radius: 8px;
      padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0; flex-grow: 1;
    }

    .panel-heading {
      font-size: 0.68rem; font-weight: 800; color: var(--text-sub);
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--panel-border); padding-bottom: 4px; flex-shrink: 0;
    }

    .super-switcher { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex-shrink: 0; }
    .ss-btn {
      background: rgba(255, 255, 255, 0.02); border: 1px solid var(--panel-border); border-radius: 6px;
      padding: 8px; text-align: center; cursor: pointer; transition: 0.2s;
    }
    .ss-btn.active.buy { background: rgba(56, 189, 248, 0.12); border-color: var(--accent-cyan); }
    .ss-btn.active.sell { background: rgba(249, 115, 22, 0.12); border-color: var(--accent-orange); }
    .ss-title { font-size: 0.75rem; font-weight: 900; }
    .ss-sub { font-size: 0.55rem; color: var(--text-sub); margin-top: 1px; }

    .market-scroll { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex-grow: 1; padding-right: 2px; }
    .asset-tile {
      background: rgba(255, 255, 255, 0.015); border: 1px solid var(--panel-border);
      border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0;
    }
    .asset-tile:hover { border-color: var(--accent-cyan); }
    .at-top { display: flex; justify-content: space-between; align-items: center; font-size: 0.6rem; }
    .at-tag { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); padding: 1px 6px; border-radius: 3px; font-weight: 700; }
    .at-name { font-size: 0.78rem; font-weight: 800; color: #fff; }
    .at-desc { font-size: 0.58rem; color: var(--text-sub); line-height: 1.3; }
    .at-bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 2px; }
    .at-price { font-size: 0.95rem; font-weight: 900; color: var(--accent-gold); font-family: var(--font-mono); }

    .btn-action-glow {
      background: var(--accent-cyan); color: #000; border: none; padding: 5px 10px;
      border-radius: 4px; font-weight: 900; font-size: 0.62rem; cursor: pointer;
    }

    .ai-wizard-box {
      display: flex; flex-direction: column; gap: 8px; flex-grow: 1; justify-content: center;
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.04), rgba(0,0,0,0));
      border: 1px dashed rgba(249, 115, 22, 0.4); border-radius: 6px; padding: 12px;
    }
    .input-field-group { display: flex; flex-direction: column; gap: 3px; }
    .input-lbl { font-size: 0.62rem; color: var(--text-sub); font-weight: 700; }
    .supreme-input {
      background: #020408; border: 1px solid var(--panel-border); border-radius: 4px;
      padding: 8px; color: #fff; font-size: 0.75rem; outline: none;
    }
    .btn-wizard-submit {
      background: linear-gradient(135deg, var(--accent-orange), #c2410c); color: #fff;
      border: none; padding: 10px; border-radius: 6px; font-weight: 900; font-size: 0.75rem; cursor: pointer;
    }

    .right-viz-stack { display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-height: 0; }
    .chart-canvas-box { width: 100%; height: 110px; background: #010306; border-radius: 6px; border: 1px solid var(--panel-border); flex-shrink: 0; }
    .terminal-output {
      background: #010306; border: 1px solid var(--panel-border); border-radius: 6px;
      padding: 6px; font-family: var(--font-mono); font-size: 0.6rem; color: var(--accent-cyan);
      flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 3px; min-height: 0;
    }

    footer {
      background: var(--panel-bg); backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border); border-radius: 8px;
      padding: 6px 12px; display: flex; justify-content: space-between; align-items: center;
      font-size: 0.6rem; color: var(--text-sub); flex-shrink: 0;
    }
    .harvest-glow-btn {
      background: linear-gradient(135deg, var(--accent-emerald), #059669); color: #fff;
      border: none; padding: 5px 12px; border-radius: 4px; font-weight: 900; font-size: 0.68rem; cursor: pointer;
    }
  </style>
</head>

  <canvas id="globalCanvas"></canvas>

  <div class="app-viewport">
    
    <header>
      <div class="brand
